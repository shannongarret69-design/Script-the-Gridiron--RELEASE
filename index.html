    <script>
      // Prevent Vite HMR connection failure logs from being captured as errors in sandboxed/preview environments.
      (function() {
        const suppressStrings = ['[vite]', 'WebSocket connection to', 'HMR', 'hmr-client', 'Hot Module Replacement'];
        
        const shouldSuppress = (msg) => {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : JSON.stringify(msg);
          return suppressStrings.some(s => str.includes(s));
        };

        // 1. Stub console methods
        ['error', 'warn', 'debug', 'log'].forEach(method => {
          const original = console[method];
          console[method] = function(...args) {
            if (args.some(arg => shouldSuppress(arg))) {
              return; // Suppress
            }
            return original.apply(this, args);
          };
        });

        // 2. Catch global errors
        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message) || (event.error && shouldSuppress(event.error.message))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // 3. Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // 4. Safely mock WebSockets for Vite HMR connections to prevent browser socket errors
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr') || url.includes('localhost') || url.includes('127.0.0.1'))) {
              const mockWs = {
                url: url,
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(() => {
                if (mockWs.onclose) {
                  mockWs.onclose({ wasClean: false, code: 1006, reason: 'HMR Disabled' });
                }
              }, 10);
              return mockWs;
            }
            try {
              return new OriginalWebSocket(url, protocols);
            } catch (e) {
              return {
                url: url,
                readyState: 3,
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
              };
            }
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          for (const key in OriginalWebSocket) {
            try {
              window.WebSocket[key] = OriginalWebSocket[key];
            } catch (err) {}
          }
          if (!window.WebSocket.CONNECTING) {
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        }
      })();
    </script>
